<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext 文字完全环绕图片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 32px; }
    .main-canvas-wrap {
      max-width: 920px;
      margin: 0 auto;
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { display: block; }

    .controls {
      max-width: 920px;
      margin: 24px auto 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .control-group label { color: #888; white-space: nowrap; }
    .control-group input[type=range] { width: 100px; accent-color: #667eea; }
    .val { color: #667eea; font-weight: 600; min-width: 28px; }

    .info-bar {
      max-width: 920px;
      margin: 16px auto 0;
      display: flex;
      gap: 24px;
      justify-content: center;
      font-size: 12px;
      color: #555;
    }
    .info-bar span b { color: #667eea; }
  </style>
</head>
<body>

<h1>Pretext 文字完全环绕图片</h1>
<p class="subtitle">layoutNextLine() · 文字从四面八方包裹图片 · 双栏同步流动</p>

<div class="main-canvas-wrap">
  <canvas id="mainCanvas"></canvas>
</div>

<div class="controls">
  <div class="control-group">
    <label>图片 X</label>
    <input type="range" id="imgX" min="40" max="500" value="240">
    <span class="val" id="imgXVal">240</span>
  </div>
  <div class="control-group">
    <label>图片 Y</label>
    <input type="range" id="imgY" min="20" max="300" value="60">
    <span class="val" id="imgYVal">60</span>
  </div>
  <div class="control-group">
    <label>图片宽</label>
    <input type="range" id="imgW" min="80" max="400" value="200">
    <span class="val" id="imgWVal">200</span>
  </div>
  <div class="control-group">
    <label>图片高</label>
    <input type="range" id="imgH" min="60" max="400" value="240">
    <span class="val" id="imgHVal">240</span>
  </div>
</div>

<div class="info-bar">
  <span>排版耗时: <b id="infoTime">-</b></span>
  <span>总行数: <b id="infoLines">-</b></span>
  <span>环绕行数: <b id="infoWrap">-</b></span>
  <span>左栏行数: <b id="infoLeft">-</b></span>
  <span>右栏行数: <b id="infoRight">-</b></span>
</div>

<script type="module">
import { prepareWithSegments, layoutNextLine, layout } from 'https://esm.sh/@chenglou/pretext'

const canvas = document.getElementById('mainCanvas')
const ctx = canvas.getContext('2d')

const FONT = '14.5px Inter, -apple-system, sans-serif'
const LINE_H = 22
const PAD = 28
const GAP = 12
const CW = 880

const article = `Pretext 是一个革命性的文本排版引擎，由 Midjourney 前端工程师 Cheng Lou 创建。它用纯 TypeScript 在用户态实现了一套高精度的文本测量系统，完全绕过了浏览器的 DOM Reflow 机制。这个项目的核心突破在于发现浏览器的 canvas.measureText() 和 DOM 渲染底层使用同一套字体引擎，但 canvas 完全在布局树之外运行。Pretext 先用 canvas 把每个文字片段量一遍并缓存宽度，之后不管怎么拉伸窗口、切换布局，排版计算全是加减乘除。在 Chrome 上 layout() 耗时仅 0.09 毫秒，比传统 DOM 测量快 483 倍；Safari 上更是快了超 1242 倍。7680 项穷举测试，三大浏览器全部像素级吻合。除了性能，Pretext 还解锁了许多此前在 Web 上被认为不可能的排版能力：文字围绕任意形状自由流动、多行文本收缩包裹、动态响应式多栏杂志布局、聊天气泡自适应宽度。这些曾经是 CSS 的噩梦，如今在 Pretext 面前都不值一提。Cheng Lou 的履历几乎串起了半部前端进化史。他是 React Motion 的创造者、ReasonML 和 ReScript 语言的缔造者、Facebook Messenger 前端的核心架构师，如今在 Midjourney 用 Bun 撑起整个 UI 体系。十年前 React 核心团队的 Sebastian Markbage 写过 text-layout 实验项目，Pretext 的架构骨架全从那来。这个只有 15KB 的引擎，预示着网页 UI 将从传统的 CSS 束缚中解脱，迈向更具想象力的 Canvas 和 GPU 渲染时代。可验证软件的成本将趋向于零——这或许才是 Pretext 真正想说的。`

function drawImage(x, y, w, h) {
  const grad = ctx.createLinearGradient(x, y, x + w, y + h)
  grad.addColorStop(0, '#1e1240')
  grad.addColorStop(0.4, '#1a2a5e')
  grad.addColorStop(0.7, '#2e1a4e')
  grad.addColorStop(1, '#1e1240')
  ctx.fillStyle = grad
  ctx.beginPath()
  ctx.roundRect(x, y, w, h, 10)
  ctx.fill()

  // glow
  ctx.shadowColor = '#667eea'
  ctx.shadowBlur = 20
  ctx.strokeStyle = '#667eea'
  ctx.lineWidth = 2
  ctx.beginPath()
  ctx.roundRect(x, y, w, h, 10)
  ctx.stroke()
  ctx.shadowBlur = 0

  // inner icon
  ctx.font = `${Math.min(w, h) * 0.25}px sans-serif`
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillStyle = 'rgba(255,255,255,0.12)'
  ctx.fillText('🖼️', x + w / 2, y + h / 2 - 10)

  ctx.font = 'bold 11px Inter, sans-serif'
  ctx.fillStyle = 'rgba(102, 126, 234, 0.7)'
  ctx.fillText('IMAGE', x + w / 2, y + h / 2 + 18)

  ctx.font = '10px monospace'
  ctx.fillStyle = 'rgba(255,255,255,0.2)'
  ctx.fillText(`${w} × ${h}`, x + w / 2, y + h - 14)

  ctx.textAlign = 'left'
  ctx.textBaseline = 'alphabetic'
}

function render() {
  const imgX = +document.getElementById('imgX').value
  const imgY = +document.getElementById('imgY').value
  const imgW = +document.getElementById('imgW').value
  const imgH = +document.getElementById('imgH').value

  const t0 = performance.now()

  const contentW = CW - PAD * 2
  const prepared = prepareWithSegments(article, FONT)

  const lines = [] // { text, x, y, side }
  let totalLines = 0
  let wrapLines = 0
  let leftLines = 0
  let rightLines = 0

  // 图片浮动区域
  const floatLeft = imgX
  const floatRight = imgX + imgW
  const floatTop = imgY
  const floatBottom = imgY + imgH

  // 左栏宽度（图片左侧）
  const leftColW = floatLeft - PAD - GAP
  // 右栏宽度（图片右侧）
  const rightColW = CW - PAD - floatRight - GAP

  // 我们把整个文本按行依次分配
  // 策略：先填满上部（全宽），到图片 Y 时拆成左右双栏交替填，过了图片后恢复全宽
  let cursor = { segmentIndex: 0, graphemeIndex: 0 }
  let curY = PAD

  // === 阶段1: 图片上方 - 全宽文本 ===
  while (cursor && curY < floatTop) {
    const line = layoutNextLine(prepared, cursor, contentW)
    if (!line) break
    lines.push({ text: line.text, x: PAD, y: curY, side: 'top', width: line.width })
    cursor = line.end
    curY += LINE_H
    totalLines++
  }

  // === 阶段2: 图片旁边 - 双栏同步 ===
  if (cursor && curY >= floatTop && curY < floatBottom) {
    // 双栏模式：左栏和右栏同时填
    // 策略：一行左、一行右交替，每栏独立排版
    let leftCursor = { ...cursor, segmentIndex: cursor.segmentIndex, graphemeIndex: cursor.graphemeIndex }
    let rightCursor = null
    let leftY = curY
    let rightY = curY
    let leftDone = false
    let rightDone = false

    // 先把左栏和右栏需要多少行算出来
    // 交替分配：先填左栏一行，再填右栏一行
    let tempCursor = { segmentIndex: cursor.segmentIndex, graphemeIndex: cursor.graphemeIndex }

    // 收集所有需要在图片高度范围内排版的行
    const floatRangeLines = floatBottom - curY
    const maxRows = Math.ceil(floatRangeLines / LINE_H)

    // 按顺序分配行到左右栏
    // 简单策略：奇数行左栏，偶数行右栏
    const leftLinesArr = []
    const rightLinesArr = []

    let rowY = curY
    let lineIdx = 0

    // 双栏分配：先完整铺左栏，再铺右栏
    // 更好的方式：按可用宽度交替
    // 最佳方式：先把全部文本按全宽切好行，然后到浮动区域时重新按双栏分配

    // 新方案：从头到尾一行行来，到图片区域时根据Y位置决定放哪
    // 重置
    cursor = { segmentIndex: 0, graphemeIndex: 0 }
    curY = PAD
    lines.length = 0
    totalLines = 0
    wrapLines = 0

    // 这次用完整方案
    let inFloatZone = false

    // 先计算图片区域有多少行空间
    const floatZoneTop = floatTop
    const floatZoneBottom = floatBottom
    const floatZoneRows = Math.floor((floatZoneBottom - floatZoneTop) / LINE_H)

    // 收集全宽行（图片上方）
    while (cursor && curY + LINE_H <= floatZoneTop + LINE_H * 0.5) {
      const line = layoutNextLine(prepared, cursor, contentW)
      if (!line) { cursor = null; break }
      lines.push({ text: line.text, x: PAD, y: curY, side: 'top', width: line.width })
      cursor = line.end
      curY += LINE_H
      totalLines++
    }

    if (cursor && leftColW > 30 && rightColW > 30) {
      // === 双栏交替分配 ===
      // 逐行分配到左或右栏
      let leftYLocal = curY
      let rightYLocal = curY
      let turnLeft = true // 交替

      while (cursor && (leftYLocal < floatZoneBottom || rightYLocal < floatZoneBottom)) {
        const targetY = turnLeft ? leftYLocal : rightYLocal
        if (targetY >= floatZoneBottom) {
          turnLeft = !turnLeft
          if (leftYLocal >= floatZoneBottom && rightYLocal >= floatZoneBottom) break
          continue
        }

        const colW = turnLeft ? leftColW : rightColW
        const colX = turnLeft ? PAD : floatRight + GAP

        const line = layoutNextLine(prepared, cursor, colW)
        if (!line) { cursor = null; break }

        lines.push({
          text: line.text,
          x: colX,
          y: targetY,
          side: turnLeft ? 'left' : 'right',
          width: line.width
        })

        cursor = line.end
        wrapLines++
        if (turnLeft) { leftYLocal += LINE_H; leftLines++ }
        else { rightYLocal += LINE_H; rightLines++ }
        totalLines++
        turnLeft = !turnLeft
      }

      curY = Math.max(leftYLocal, rightYLocal)
    } else if (cursor) {
      // 只有一侧有空间，单栏环绕
      while (cursor && curY < floatZoneBottom) {
        let lineStart = PAD
        let lineEnd = CW - PAD

        if (curY >= floatZoneTop && curY < floatZoneBottom) {
          if (leftColW <= 30) lineStart = floatRight + GAP
          else lineEnd = floatLeft - GAP
        }

        const availW = lineEnd - lineStart
        if (availW < 30) { curY += LINE_H; continue }

        const line = layoutNextLine(prepared, cursor, availW)
        if (!line) { cursor = null; break }

        lines.push({ text: line.text, x: lineStart, y: curY, side: 'wrap', width: line.width })
        cursor = line.end
        curY += LINE_H
        wrapLines++
        totalLines++
      }
    }
  }

  // === 阶段3: 图片下方 - 恢复全宽 ===
  // 确保 curY 至少到图片底部
  if (curY < floatBottom) curY = floatBottom

  while (cursor) {
    const line = layoutNextLine(prepared, cursor, contentW)
    if (!line) break
    lines.push({ text: line.text, x: PAD, y: curY, side: 'bottom', width: line.width })
    cursor = line.end
    curY += LINE_H
    totalLines++
  }

  const totalHeight = curY + PAD
  canvas.width = CW
  canvas.height = totalHeight

  // 背景
  ctx.fillStyle = '#111'
  ctx.fillRect(0, 0, CW, totalHeight)

  // 画浮动区域底色
  ctx.fillStyle = 'rgba(102, 126, 234, 0.03)'
  ctx.fillRect(PAD, floatTop, contentW, floatBottom - floatTop)

  // 画辅助网格
  ctx.setLineDash([2, 6])
  ctx.strokeStyle = 'rgba(102, 126, 234, 0.1)'
  ctx.lineWidth = 1
  // 左栏右边界
  if (leftColW > 30) {
    ctx.beginPath()
    ctx.moveTo(floatLeft - GAP, floatTop)
    ctx.lineTo(floatLeft - GAP, floatBottom)
    ctx.stroke()
  }
  // 右栏左边界
  if (rightColW > 30) {
    ctx.beginPath()
    ctx.moveTo(floatRight + GAP, floatTop)
    ctx.lineTo(floatRight + GAP, floatBottom)
    ctx.stroke()
  }
  ctx.setLineDash([])

  // 画图片
  drawImage(imgX, imgY, imgW, imgH)

  // 画文本
  ctx.font = FONT
  lines.forEach(line => {
    switch (line.side) {
      case 'left':
        ctx.fillStyle = '#a8b8ff' // 左栏：淡蓝紫
        break
      case 'right':
        ctx.fillStyle = '#a8ffb8' // 右栏：淡绿
        break
      case 'top':
      case 'bottom':
        ctx.fillStyle = '#d8d8d8' // 全宽：浅灰
        break
      default:
        ctx.fillStyle = '#c8c8c8'
    }
    ctx.fillText(line.text, line.x, line.y + LINE_H - 5)
  })

  // 标注
  ctx.font = 'bold 10px monospace'
  if (leftColW > 30 && wrapLines > 0) {
    ctx.fillStyle = 'rgba(168, 184, 255, 0.5)'
    ctx.fillText('← 左栏', PAD, floatTop - 4)
  }
  if (rightColW > 30 && wrapLines > 0) {
    ctx.fillStyle = 'rgba(168, 255, 184, 0.5)'
    ctx.fillText('右栏 →', floatRight + GAP, floatTop - 4)
  }

  const elapsed = (performance.now() - t0).toFixed(2)
  document.getElementById('infoTime').textContent = elapsed + 'ms'
  document.getElementById('infoLines').textContent = totalLines
  document.getElementById('infoWrap').textContent = wrapLines
  document.getElementById('infoLeft').textContent = leftLines
  document.getElementById('infoRight').textContent = rightLines
}

// Bind
['imgX', 'imgY', 'imgW', 'imgH'].forEach(id => {
  const el = document.getElementById(id)
  const valEl = document.getElementById(id + 'Val')
  el.addEventListener('input', () => { valEl.textContent = el.value; render() })
})

render()
</script>
</body>
</html>
